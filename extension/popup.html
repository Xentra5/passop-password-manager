<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'" />
    <title>PassVault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="screen-loading" class="screen active">
      <div class="loading-spinner"></div>
      <p class="loading-text">PassVault</p>
    </div>

    <!-- Login Screen -->
    <div id="screen-login" class="screen">
      <div class="popup-header">
        <div class="logo-row">
          <div class="logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 2C9.24 2 7 4.24 7 7v1H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V7c0-1.66 1.34-3 3-3zm0 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="currentColor"/>
            </svg>
          </div>
          <div>
            <h1 class="logo-title">PassVault</h1>
            <p class="logo-sub">Zero-knowledge autofill</p>
          </div>
        </div>
      </div>

      <div class="popup-body">
        <div id="login-error" class="alert alert-error hidden"></div>

        <div class="field-group">
          <label class="field-label" for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            class="field-input"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="login-password">Master Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="login-password"
              class="field-input"
              placeholder="Master password"
              autocomplete="current-password"
            />
            <button class="toggle-pw" data-target="login-password" title="Show/hide password">
              <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <button id="btn-login" class="btn btn-primary">
          <span class="btn-text">Unlock Vault</span>
          <span class="btn-spinner hidden"></span>
        </button>

        <p class="helper-text">
          Unlocking connects to your local PassVault app at <code>localhost:3000</code>
        </p>
      </div>
    </div>

    <!-- Unlocked / Credentials Screen -->
    <div id="screen-vault" class="screen">
      <div class="popup-header">
        <div class="header-top">
          <div class="logo-row-sm">
            <div class="logo-icon-sm">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C9.24 2 7 4.24 7 7v1H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V7c0-1.66 1.34-3 3-3zm0 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="currentColor"/>
              </svg>
            </div>
            <span class="logo-title-sm">PassVault</span>
          </div>
          <div class="header-actions">
            <button id="btn-lock" class="icon-btn" title="Lock vault">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="tab-domain-row">
          <div id="tab-favicon" class="tab-favicon"></div>
          <div class="tab-domain-info">
            <span class="tab-domain-label">Current site</span>
            <span id="tab-domain" class="tab-domain-value">—</span>
          </div>
        </div>
      </div>

      <div class="popup-body">
        <!-- Search -->
        <div class="search-row">
          <div class="search-wrapper">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
            </svg>
            <input id="search-input" class="search-input" type="text" placeholder="Search credentials…" />
          </div>
        </div>

        <!-- Credentials List -->
        <div id="credentials-loading" class="state-loading hidden">
          <div class="loading-spinner-sm"></div>
          <span>Fetching credentials…</span>
        </div>

        <div id="credentials-empty" class="state-empty hidden">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" opacity="0.4">
            <path d="M12 2C9.24 2 7 4.24 7 7v1H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V7c0-1.66 1.34-3 3-3zm0 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="currentColor"/>
          </svg>
          <p id="empty-msg" class="empty-msg">No credentials match this site</p>
          <p class="empty-sub">Save passwords in PassVault to auto-fill here</p>
        </div>

        <div id="credentials-error" class="state-error hidden">
          <span id="credentials-error-text"></span>
        </div>

        <ul id="credentials-list" class="cred-list"></ul>

        <!-- Fill feedback -->
        <div id="fill-toast" class="fill-toast hidden">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
          </svg>
          <span id="fill-toast-text">Filled!</span>
        </div>
      </div>

      <div class="popup-footer">
        <span id="user-email-display" class="user-email"></span>
        <a id="open-app-link" href="http://localhost:5173" target="_blank" class="footer-link">Open App ↗</a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
